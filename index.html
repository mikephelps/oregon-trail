<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Oregon Trail</title>
  <meta name="description" content="A fan remake of the classic wagon-trail game. Runs in any browser, no install.">
  <meta name="theme-color" content="#efe4cf">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%23b0462a%22/%3E%3Cpath d=%22M8 20c0-7 3-10 8-10s8 3 8 10z%22 fill=%22%23fbf6ea%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="brand" data-act="menu" type="button" aria-label="Main menu"></button>
      <div class="topbar-right" id="topbar-right"></div>
    </header>
    <section id="scene" class="scene" aria-hidden="true"></section>
    <div id="trailbar" class="trailbar"></div>
    <main id="main" class="main"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem">This game needs JavaScript turned on.</p></noscript>

  <script src="js/content.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
